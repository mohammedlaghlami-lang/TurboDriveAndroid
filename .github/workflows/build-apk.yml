
name: Build TurboDrive APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project archive
        run: |
          test -f TurboDriveAndroid_Project_ready.zip || {
            echo "Project ZIP was not found in repository root."
            exit 1
          }

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -o TurboDriveAndroid_Project_ready.zip -d source
          test -f source/TurboDriveAndroid/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: source/TurboDriveAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboDrive-Android-APK
          path: source/TurboDriveAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
