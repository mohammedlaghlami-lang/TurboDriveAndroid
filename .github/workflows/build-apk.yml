name: Build TurboDrive APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ls -la
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'TurboDriveAndroid_Project_ready*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          echo "Found: $ZIP_FILE"
          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          if [ -f source/TurboDriveAndroid/app/build.gradle ] || [ -f source/TurboDriveAndroid/app/build.gradle.kts ]; then
            PROJECT_DIR=source/TurboDriveAndroid
          elif [ -f source/app/build.gradle ] || [ -f source/app/build.gradle.kts ]; then
            PROJECT_DIR=source
          else
            echo "Android project not found"
            find source -maxdepth 5 -type f
            exit 1
          fi
          gradle -p "$PROJECT_DIR" assembleDebug
          mkdir -p output
          find "$PROJECT_DIR" -type f -name '*.apk' -exec cp {} output/app-debug.apk \;
          test -f output/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboDriveX-Legends-APK
          path: output/app-debug.apk
          if-no-files-found: error
