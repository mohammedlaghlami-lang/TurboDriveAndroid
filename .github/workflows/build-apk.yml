name: Build TurboDrive APK

on:
workflow_dispatch:
push:
branches: [ main, master ]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Find and extract game project
    run: |
      set -e
      echo "Files in repository:"
      ls -la

      ZIP_FILE=$(find . -maxdepth 1 -type f -name 'TurboDriveAndroid_Project_ready*.zip' | head -n 1)

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: Game project ZIP was not found."
        exit 1
      fi

      echo "Using archive: $ZIP_FILE"
      mkdir -p source
      unzip -o "$ZIP_FILE" -d source

      echo "Extracted files:"
      find source -maxdepth 3 -type f | head -80

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Prepare Android SDK
    run: |
      echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Locate Android project
    run: |
      set -e
      if [ -f source/TurboDriveAndroid/app/build.gradle ] || [ -f source/TurboDriveAndroid/app/build.gradle.kts ]; then
        echo "PROJECT_DIR=source/TurboDriveAndroid" >> "$GITHUB_ENV"
      elif [ -f source/app/build.gradle ] || [ -f source/app/build.gradle.kts ]; then
        echo "PROJECT_DIR=source" >> "$GITHUB_ENV"
      else
        echo "ERROR: Android app build.gradle was not found."
        find source -maxdepth 5 -type f | head -150
        exit 1
      fi

  - name: Build APK
    run: gradle -p "$PROJECT_DIR" assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: TurboDriveX-Legends-APK
      path: |
        source/**/build/outputs/apk/debug/app-debug.apk
        source/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
